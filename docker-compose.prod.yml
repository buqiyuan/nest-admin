# 启动前复制 .env.production.example 为 .env.production，并设置至少 32 位的随机
# JWT_SECRET 与 REFRESH_TOKEN_SECRET。密钥缺失、过短或仍是已知占位值时，应用会拒绝启动。
version: '3'

services:
  nest-admin-server:
    image: buqiyuan/nest-admin-server:stable
    container_name: nest-admin-server
    pull_policy: always
    restart: always
    env_file:
      - .env
      - .env.production
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    ports:
      - '${APP_PORT}:${APP_PORT}'
    networks:
      - nest_admin_net

networks:
  nest_admin_net:
    name: nest_admin_net
