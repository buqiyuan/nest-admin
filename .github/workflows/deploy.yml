name: Deploy

on:
  workflow_run:
    workflows: [Sync To Gitee]
    types:
      - completed

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to remote server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USERNAME }}
          password: ${{ secrets.REMOTE_PASSWORD }}
          port: ${{ secrets.REMOTE_PORT }}
          script: |
            cd ${{ secrets.REMOTE_WORKDIR }}
            git reset --hard origin/main
            git pull
            pnpm install
            pnpm build
            echo "${{ secrets.DEPLOY_ENV_FILE }}" > .env
            # DEPLOY_ENV_PROD_FILE 必须包含各自独立、至少 32 位的 JWT_SECRET 与 REFRESH_TOKEN_SECRET。
            # 应用会拒绝使用空值、过短值或已知占位密钥启动。
            echo "${{ secrets.DEPLOY_ENV_PROD_FILE }}" > .env.production
            pnpm prod:pm2
